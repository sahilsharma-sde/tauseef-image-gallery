<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Gallery</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!--  HEADER SECTION -->
  <header>
    <span>Image Gallery</span>
  </header>

  <!--  MAIN SECTION  -->
  <main class="container my-3">

    <!--  IMAGE SECTION  -->
    <section id="imageSection"></section>

    <!--  BUTTONS  -->
    <section id="buttonSection" class="mt-3">
      <form class="searchImage">
        <input class="form-control" type="search" placeholder="Search images" />
        <input type="number" id="countInput" min="1" max="3" value="2" />
        <button class="btn btn-outline-success">🔍 Search</button>
      </form>

      <button id="addImageBtn" class="btn btn-outline-primary">
        ➕ Add Random Image
      </button>
    </section>
  </main>

  <!--  FOOETR  -->
  <footer>
    <p>&copy; 2026 Image Gallery</p>
  </footer>

  <!-- FULLSCREEN VIEW -->
  <div id="fullscreenOverlay">
    <img id="fullscreenImage" />

    <div class="fs-controls">
      <button id="prevBtn" class="btn btn-light">⏮</button>
      <button id="playBtn" class="btn btn-light">▶️</button>
      <button id="nextBtn" class="btn btn-light">⏭</button>
      <button id="downloadBtn" class="btn btn-success">⬇️</button>
      <button id="deleteBtn" class="btn btn-danger">🗑</button>
      <button id="closeBtn" class="btn btn-warning">❌</button>
    </div>
  </div>

  <!--  JAVASCRIPT LINKING  -->
  <script src="script.js"></script>
</body>
</html>
